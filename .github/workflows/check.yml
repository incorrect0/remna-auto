name: Check installer
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: bash -n install.sh run.sh controller-install.sh bootstrap-deps.sh
      - run: python -m py_compile setup.py controller.py remote_worker.py
      - run: python -m pip install ruff==0.17.1
      - run: ruff check --no-cache --select E9,F63,F7,F82 setup.py controller.py remote_worker.py tests
      - run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - run: shellcheck install.sh run.sh controller-install.sh bootstrap-deps.sh
      - run: python -m unittest discover -s tests -v
      - run: python tools/checksums.py --check
      - run: python tools/check_public_files.py
